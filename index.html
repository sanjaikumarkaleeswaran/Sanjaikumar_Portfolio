    <!-- Google Fonts — reduced to only used weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      /* Prevent white flash during bundle loading */
      html, body {
        background-color: #030014;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 240, 255, 0.3) rgba(5, 5, 15, 0.5);
      }
      
      /* Custom scrollbar for modern browsers */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #05050f;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 240, 255, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.6);
      }
    </style>
  </head>
  <body class="bg-cyber-bg text-cyber-text antialiased">
    <div id="root">
      <!-- Instant loading skeleton — replaced by React once bundle parses -->
      <div id="html-shell" style="
        position:fixed;inset:0;background:#030014;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-family:'Inter',monospace;color:#00f0ff;z-index:99999;
      ">
        <div style="
          width:48px;height:48px;border-radius:50%;
          border:2px solid rgba(0,240,255,0.15);
          border-top-color:#00f0ff;
          animation:spin 0.8s linear infinite;
        "></div>
        <p style="margin-top:20px;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;opacity:0.5;">
          Initializing AI Core...
        </p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove the HTML shell once React mounts
      window.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          const shell = document.getElementById('html-shell');
          if (root && root.children.length > 1 && shell) {
            shell.style.opacity = '0';
            shell.style.transition = 'opacity 0.3s ease';
            setTimeout(() => shell.remove(), 300);
            observer.disconnect();
          }
        });
        const root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true, subtree: true });
      });
    </script>
  </body>
</html>
